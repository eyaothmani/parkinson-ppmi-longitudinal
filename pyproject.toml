[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinson-mm"
version = "1.5.0"
description = "Analyse longitudinale multimodale de la maladie de Parkinson (cohorte PPMI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code) — données PPMI sous Data Use Agreement, non redistribuées" }
dependencies = [
    "numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "statsmodels>=0.14", "scikit-learn>=1.5",
    "lightgbm>=4.3", "torch>=2.3", "pyyaml>=6", "mlflow>=3.18",   # mlflow.db est au schéma 3.18
]

[project.optional-dependencies]
# API + tableau de bord (servi par l'API, sans framework JavaScript)
api = ["fastapi>=0.110", "uvicorn>=0.29"]
notebooks = ["matplotlib>=3.8", "seaborn>=0.13", "jupyter", "openpyxl"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "pre-commit>=3.7", "dvc>=3.50"]
# Assistant documentaire (séparé du pipeline PPMI) : LangChain (découpage, LLM via API compatible OpenAI), FAISS, embeddings locaux
rag = ["langchain-core>=1.7", "langchain-text-splitters>=1.1", "langchain-openai>=1.1",
       "sentence-transformers>=6", "faiss-cpu>=1.12", "pypdf>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parkinson_mm = ["serving/web/**/*"]   # tableau de bord (HTML, CSS, JS)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = ["integration: tests de bout en bout (plus lents)"]
# PATNO entier dans la signature : voulu (identifiant jamais manquant, cf. serving/pyfunc.py)
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning",
                  "ignore:Hint. Inferred schema contains integer column:UserWarning"]

[tool.coverage.run]
source = ["src/parkinson_mm"]
omit = ["src/parkinson_mm/visualization/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]   # Depends(...) en valeur par défaut : idiome FastAPI

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src/parkinson_mm/utils", "src/parkinson_mm/data/split.py", "src/parkinson_mm/evaluation"]
