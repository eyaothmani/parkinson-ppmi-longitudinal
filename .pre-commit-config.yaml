repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
  - repo: https://github.com/kynan/nbstripout          # pas de sorties de notebook (données patient) dans Git
    rev: 0.7.1
    hooks:
      - id: nbstripout
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: ^uv\.lock$                      # fichier de verrouillage : gros par nature
      - id: check-yaml
      - id: end-of-file-fixer
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: file-length
        name: fichiers Python <= 60 lignes
        entry: python tools/check_file_length.py
        language: system
        pass_filenames: false
        types: [python]
