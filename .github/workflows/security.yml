name: security
on:
  pull_request:
  schedule: [{cron: "0 6 * * 1"}]   # chaque lundi
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv export --frozen --all-extras --no-hashes > requirements.txt && uvx pip-audit -r requirements.txt
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.train -t parkinson-mm-train:scan .
      - uses: aquasecurity/trivy-action@0.24.0
        with: {image-ref: "parkinson-mm-train:scan", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
