# CI : tourne SANS les vraies données (jeu synthétique au schéma PPMI généré à la volée).
name: ci
on:
  push: {branches: [main]}
  pull_request:
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uvx ruff check src scripts tests tools
      - run: python tools/check_file_length.py
  test:
    runs-on: ubuntu-latest
    needs: lint
    env: {MLFLOW_DISABLE_AGENT_HINT: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --extra dev --extra rag --extra api
      - name: Tests unitaires
        run: uv run pytest tests/unit -q
      - name: Suite complète avec couverture (pipeline + registry)
        run: uv run pytest -q --cov --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.xml}
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.train -t parkinson-mm-train:ci .
