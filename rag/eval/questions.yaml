# Questions de référence de l'assistant documentaire, écrites AVANT toute mesure (21/11/2026).
# Chaque réponse a été vérifiée à la main dans le texte des PDF ou du README. Elles ne servent à régler aucun
# paramètre (22 questions : trop peu pour régler PUIS mesurer) : les réglages de params.yaml sont fixés avant.
# type corpus      : le document attendu doit être parmi les k passages retrouvés (hit@k, MRR)
# type hors_corpus : la réponse attendue est « Je ne trouve pas cela dans le corpus » (mesuré avec le LLM)
# type medical     : question médicale personnelle, refus attendu avant toute recherche
